# ---------------------------------------------------------------------------
# Ycf 的博客 — Hugo + PaperMod
# Docs: https://github.com/adityatelange/hugo-PaperMod/wiki
# ---------------------------------------------------------------------------

baseURL: "https://aboyfeng.github.io/"
title: "Ycf 的博客"
theme: "PaperMod"

locale: "zh-CN"
defaultContentLanguage: "zh"
hasCJKLanguage: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

pagination:
  pagerSize: 6

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS

module:
  hugoVersion:
    min: "0.146.0"
    extended: true

taxonomies:
  tag: tags
  category: categories

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

sitemap:
  changefreq: weekly
  priority: 0.5

menus:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

params:
  env: production
  description: "软件、系统与一些实验的笔记。"
  author: "ycf"

  defaultTheme: auto
  disableThemeToggle: false

  # 文章日期显示为中文格式
  DateFormat: "2006年1月2日"

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # Home page intro
  homeInfoParams:
    Title: "你好，我是 ycf 👋"
    Content: "这里记录软件、系统，以及偶尔做的一些实验。有值得写下来的东西时，就会更新。"

  # Site icons (files live in static/)
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"

  socialIcons:
    - name: github
      url: "https://github.com/aboyfeng"
    - name: rss
      url: "index.xml"

  # Client-side search (Fuse.js) — needs the JSON output above
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys:
      - title
      - permalink
      - summary
      - content
